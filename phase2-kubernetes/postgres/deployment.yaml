apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devx
spec:
  accessModes:
    - ReadWriteOnce       # one node can mount this at a time
  resources:
    requests:
      storage: 1Gi        # 1GB for local dev is plenty

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devx
spec:
  replicas: 1             # databases are stateful — always 1 replica
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:       # pulled from Secret, not ConfigMap
                  name: app-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - appuser
                - -d
                - appdb
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service    # ← this name is the DNS hostname other pods use
  namespace: devx
spec:
  selector:
    app: postgres           # routes to pods with label app=postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP           # internal only, not exposed outside cluster
