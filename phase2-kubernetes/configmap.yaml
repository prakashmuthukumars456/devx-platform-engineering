apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devx
data:
  # App
  APP_NAME: "fastapi-k8s-app"
  APP_VERSION: "1.0.0"
  APP_ENV: "development"
  DEBUG: "true"

  # Database — notice hostname is the K8s Service name, not localhost
  # In K8s, services talk to each other using service names as DNS
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "appdb"

  # Redis — same pattern, service name as hostname
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
