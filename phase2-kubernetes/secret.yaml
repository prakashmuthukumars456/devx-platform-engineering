apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: devx
type: Opaque
data:
  # Values must be base64 encoded
  # To encode: echo -n "yourvalue" | base64
  # To decode: echo "encodedvalue" | base64 -d

  # "appuser" encoded
  POSTGRES_USER: YXBwdXNlcg==

  # "apppassword" encoded
  POSTGRES_PASSWORD: YXBwcGFzc3dvcmQ=

  # "redispassword" encoded
  REDIS_PASSWORD: cmVkaXNwYXNzd29yZA==
