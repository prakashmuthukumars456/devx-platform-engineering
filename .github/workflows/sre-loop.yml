# .github/workflows/sre-loop.yml
name: Freight SRE - Autonomous Incident Response

on:
  repository_dispatch:
    types: [freight-alert]   # different event type from Phase 7's "datadog-alert"
  workflow_dispatch:          # manual trigger for demo/testing

permissions:
  issues: write
  contents: read

jobs:
  freight-sre-loop:
    runs-on: self-hosted      # same devx-local runner, no change needed
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd phase8-freight-sre-loop
          pip install -r requirements.txt --break-system-packages

      - name: Run Freight SRE Agent
        run: |
          cd phase8-freight-sre-loop
          python3 sre_agent.py
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

      - name: Upload postmortem artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postmortem-${{ github.run_id }}
          path: phase8-freight-sre-loop/postmortem_*.json
