name: Freight SRE - Autonomous Incident Response

on:
  repository_dispatch:
    types: [freight-alert]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  freight-sre-loop:
    runs-on: self-hosted

    steps:
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages
        working-directory: /home/silk/devx-platform-engineering/phase8-freight-sre-loop

      - name: Run Freight SRE Agent
        run: python3 sre_agent.py
        working-directory: /home/silk/devx-platform-engineering/phase8-freight-sre-loop
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          TRACKING_API_URL: http://localhost:8000
          ALERT_PAYLOAD: ${{ toJson(github.event.client_payload) }}

      - name: Upload postmortem artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postmortem-${{ github.run_id }}
          path: /home/silk/devx-platform-engineering/phase8-freight-sre-loop/postmortem_*.json
